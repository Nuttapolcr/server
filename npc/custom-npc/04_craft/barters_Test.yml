Header:
  Type: BARTER_DB
  Version: 1

Body:
  - Name: Test Barter
    Map: morocc
    X: 206
    Y: 39
    Direction: South
    Sprite: 4_F_PINKWOMAN
    CraftBarter: true # ปรับเป็นร้านระบบคราฟท์
    WaitingRoom: "> ร้าน Barter <" # ป้ายแสดง waitingroom
    Items:
      - Index: 0 # ควรเริ่มจาก 0 ไม่งั้น สืบทอดกับ กันแตกจะเพี้ยน
        Item: Plate_Armor_
        Rate: 2000
        Zeny: 1000000
        Announce: true # ประกาศคราฟท์ติด
        Effect: 722 # effect เวลาคราฟท์ติด
        FailEffect: 102 # effect เวลาคราฟท์ไม่ติด
        ProtectItem: Orange_Potion # กันแตก
        BlessingItem: Red_Potion # ใบเพิ่ม %
        BlessingRate: 1000 # โอกาสต่อใบ
        BlessingMax: 3 # จำกัดใช้ได้ไม่เกิน 3 ใบต่อครั้ง
        IsNPC: true # เวลาคราฟท์ link ไป NPC
        GuaranteeVar: "Craft_1" ## ชื่อตัวแปรการันตี การันตีแตกกี่ครั้งครั้งถัดไป จะติด 100%
        GuaranteeCount: 10 ## จำนวน fail
        Inherit: # ระบบสืบทอดความสามารถ
          - Index: 0 # ตำแหน่ง index ของ วัตถุดิบ
            Refine: true # สืบทอดตีบวก
            Card: true # สืบทอดการ์ด
            Grade: true # สืบทอดเกรด
            Randomopt: true # สืบทอดออฟ
        RequiredItems:
          - Index: 0
            Item: Blade
            Amount: 1
            Protect: true # หากมีใบกันแตก ของชิ้นนี้จะไม่ถูกลบ
            NoBreak: true # ไม่แหก ต่อให้ไม่ใช่ใบกันแตก
          - Index: 1
            Item: Blade_
            Amount: 1
            Refine: 1
          - Index: 2
            Item: Hat
            Amount: 1
            Protect: true  # หากมีใบกันแตก ของชิ้นนี้จะไม่ถูกลบ
      - Index: 1
        Item: Elunium
        Rate: 10000
        Zeny: 1000000
        RequiredItems:
          - Index: 0
            Item: Red_Potion
            Amount: 1
          - Index: 1
            Item: Orange_Potion
            Amount: 1
          - Index: 2
            Item: Yellow_Potion
            Amount: 1
          - Index: 3
            Item: White_Potion
            Amount: 1
          - Index: 4
            Item: Blue_Potion
            Amount: 1

