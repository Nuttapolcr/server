      bonus bAddMaxWeight,15000;
      bonus2 bDropAddRace,RC_All,15;
    PveScript: |
      bonus bMaxHP,2000;
      bonus bMaxSP,200;
      bonus bSpeedAddRate,7;

  - Rank: 5
    Name: Diamond
    Threshold: 35000
    BoxSpeed: 18
    Icon: EFST_MEMBER5
