      bonus bAddMaxWeight,15000;
      bonus2 bDropAddRace,RC_All,18;
    PveScript: |
      bonus bMaxHP,2000;
      bonus bMaxSP,200;
      bonus bSpeedAddRate,7;
      bonus bDelayrate,-5;

  - Rank: 6
    Name: Master
